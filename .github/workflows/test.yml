name: test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      # npm ci also builds dist through the prepare script
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Run the built package
        run: >-
          node --input-type=module -e "import {Session} from 'cmil';
          const step = new Session('print(1)', 'en').run(); console.log(step.output);
          if (step.state !== 'end' || step.error) process.exit(1);"
