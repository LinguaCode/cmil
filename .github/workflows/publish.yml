name: publish

on:
  release:
    types: [published]

permissions:
  contents: read
  # trusted publishing: npm exchanges this token for a short-lived publish token
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm ci also builds dist through the prepare script
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # the first version was published by hand, before trusted publishing could be set up
      - name: Publish unless this version is on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The release tag $GITHUB_REF_NAME doesn't match the package version $version."
            exit 1
          fi
          if [ -n "$(npm view "cmil@$version" version 2>/dev/null)" ]; then
            echo "cmil@$version is already on npm."
          else
            npm publish --tag latest
          fi
