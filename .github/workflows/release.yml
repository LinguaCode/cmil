name: release

on:
  push:
    tags: ['v*']

permissions:
  # create the GitHub Release
  contents: write
  # trusted publishing: npm exchanges this token for a short-lived publish token
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm ci also builds dist through the prepare script
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Check the tag
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the package version $version."
            exit 1
          fi
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${GITHUB_REF_NAME#v}
          # the notes are this version's section of the CHANGELOG
          awk -v heading="## $version " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $version."
            exit 1
          fi
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "The release $GITHUB_REF_NAME already exists."
          elif [[ "$version" == *-* ]]; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md --prerelease
          else
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file notes.md
          fi
      # the first version on npm is published by hand, before trusted publishing can be set up
      - name: Publish to npm
        run: |
          version=${GITHUB_REF_NAME#v}
          # cmil is on npm from the first release candidate: alpha and beta versions stay on GitHub
          if [[ "$version" == *-* && "$version" != *-rc.* ]]; then
            echo "cmil@$version is a pre-release before the release candidates, so it isn't published to npm."
          elif [ -n "$(npm view "cmil@$version" version 2>/dev/null)" ]; then
            echo "cmil@$version is already on npm."
          else
            npm publish --tag latest
          fi
