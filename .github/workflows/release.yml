name: release

on:
  push:
    tags: ['v*']
  # run on master to tag the package version there and release it
  workflow_dispatch:

permissions:
  # create the GitHub Release
  contents: write
  # trusted publishing: npm exchanges this token for a short-lived publish token
  id-token: write
  # whether the test workflow passed on the commit
  actions: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm ci also builds dist through the prepare script
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      # the tests but those that build and run the converted programs, as the check job of the test workflow runs them
      - run: npm test
        env:
          CMIL_TARGETS: ''
      # the converted programs are built and run by the convert jobs of the test workflow, which has to have passed on
      # this commit
      - name: Check the test workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow test --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$passed" = 0 ]; then
            echo "The test workflow hasn't passed on $GITHUB_SHA."
            exit 1
          fi
      - name: Check the version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then
            if [ "$GITHUB_REF_NAME" != master ]; then
              echo "Run the release on master, not on $GITHUB_REF_NAME."
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME doesn't match the package version $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$VERSION"
          # the notes are this version's section of the CHANGELOG
          awk -v heading="## $VERSION " 'index($0, heading) == 1 { found = 1; next } found && /^## / { exit } found' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "CHANGELOG.md has no section for $VERSION."
            exit 1
          fi
          # a missing tag is created on this commit; the tag isn't pushed, so it doesn't start this workflow again
          if gh release view "$tag" > /dev/null 2>&1; then
            echo "The release $tag already exists."
          elif [[ "$VERSION" == *-* ]]; then
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md --prerelease
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "$tag" --notes-file notes.md
          fi
      # the first version on npm is published by hand, before trusted publishing can be set up
      - name: Publish to npm
        run: |
          # cmil is on npm from the first release candidate: alpha and beta versions stay on GitHub
          if [[ "$VERSION" == *-* && "$VERSION" != *-rc.* ]]; then
            echo "cmil@$VERSION is a pre-release before the release candidates, so it isn't published to npm."
          elif [ -n "$(npm view "cmil@$VERSION" version 2>/dev/null)" ]; then
            echo "cmil@$VERSION is already on npm."
          else
            npm publish --tag latest
          fi
